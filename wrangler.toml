name = "newsdeck"
main = "worker/index.ts"
compatibility_date = "2026-11-01"

# Die gebaute Seite (npm run build). Cloudflare liefert sie direkt aus, ohne den Worker aufzurufen;
# unbekannte Pfade bekommen index.html. Nur /api/* geht an den Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
